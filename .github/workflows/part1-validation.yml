name: Part 1 Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-part1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required Part 1 files
        run: |
          test -f docs/API-Endpoint-Plan.md
          test -f docs/RaceDay.sql
          echo "Part 1 required files are present."